<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>页面源码查看器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>页面源码查看器</h2>
      <div class="controls">
        <button id="getSource" class="btn btn-primary">获取源码</button>
        <button id="extractProducts" class="btn btn-primary">提取商品</button>
        <button id="sendToBackend" class="btn btn-success">发送到后端</button>
        <button id="getServerData" class="btn btn-info">获取服务器数据</button>
        <button id="copySource" class="btn btn-secondary">复制</button>
        <button id="downloadSource" class="btn btn-secondary">下载</button>
      </div>
    </div>
    
    <div class="info">
      <div class="url-info">
        <strong>当前页面：</strong>
        <span id="currentUrl">正在获取...</span>
      </div>
      <div class="stats">
        <span id="sourceLength">源码长度：0 字符</span>
      </div>
    </div>
    
    <div class="source-container">
      <textarea id="sourceCode" placeholder="点击'获取源码'按钮来查看当前页面的HTML源码..." readonly></textarea>
    </div>
    
    <div class="products-container" id="productsContainer" style="display: none;">
      <div class="products-header">
        <h3>提取的商品信息</h3>
        <div class="products-actions">
          <button id="exportProducts" class="btn btn-secondary btn-small">导出数据</button>
          <button id="toggleView" class="btn btn-secondary btn-small">切换视图</button>
        </div>
      </div>
      <div class="products-summary" id="productsSummary"></div>
      <div class="products-filters">
        <input type="text" id="searchProducts" placeholder="搜索商品..." class="search-input">
        <select id="sortProducts" class="sort-select">
          <option value="default">默认排序</option>
          <option value="price-asc">价格升序</option>
          <option value="price-desc">价格降序</option>
          <option value="sales-desc">销量降序</option>
          <option value="rating-desc">评分降序</option>
        </select>
      </div>
      <div id="productsResult" class="products-list"></div>
    </div>
    
    <div class="server-data-container" id="serverDataContainer" style="display: none;">
      <div class="server-data-header">
        <h3>服务器数据</h3>
        <div class="server-data-actions">
          <select id="dataTypeSelect" class="data-type-select">
            <option value="">选择数据类型</option>
            <option value="config">配置信息</option>
            <option value="tasks">任务列表</option>
            <option value="notifications">通知消息</option>
          </select>
          <button id="refreshServerData" class="btn btn-secondary btn-small">刷新</button>
          <button id="exportServerData" class="btn btn-secondary btn-small">导出</button>
        </div>
      </div>
      <div class="server-data-info" id="serverDataInfo"></div>
      <div class="server-data-content">
        <textarea id="serverDataDisplay" placeholder="点击'获取服务器数据'按钮来获取服务器端的JSON数据..." readonly></textarea>
      </div>
    </div>
    
    <div class="status" id="status"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
