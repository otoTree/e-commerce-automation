<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce AI Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>AI购物助手</h1>
      <div class="status-indicator" id="status"></div>
    </header>
    
    <!-- 连接状态区域 -->
    <div class="connection-status">
      <div class="status-item">
        <span class="status-label">后端连接:</span>
        <span class="status-value" id="backend-status">检测中...</span>
        <div class="status-dot" id="backend-dot"></div>
      </div>
      <div class="status-item">
        <span class="status-label">任务轮询:</span>
        <span class="status-value" id="polling-status">检测中...</span>
        <div class="status-dot" id="polling-dot"></div>
      </div>
    </div>
    
    <!-- 任务状态区域 -->
    <div class="task-status">
      <h3>任务状态</h3>
      <div class="task-stats">
        <div class="stat-item">
          <span class="stat-number" id="pending-count">0</span>
          <span class="stat-label">待处理</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="processing-count">0</span>
          <span class="stat-label">处理中</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="completed-count">0</span>
          <span class="stat-label">已完成</span>
        </div>
      </div>
      <div class="recent-tasks" id="recent-tasks">
        <div class="no-tasks">暂无任务</div>
      </div>
    </div>
    
    <main class="popup-main">
      <div class="feature-section">
        <h2>功能</h2>
        <div class="feature-buttons">
          <button id="analyze-page" class="feature-btn">
            <span class="icon">🔍</span>
            分析当前页面
          </button>
          <button id="price-compare" class="feature-btn">
            <span class="icon">💰</span>
            价格比较
          </button>
          <button id="reviews-summary" class="feature-btn">
            <span class="icon">⭐</span>
            评价摘要
          </button>
          <button id="upload-html" class="feature-btn">
            <span class="icon">📤</span>
            上传页面HTML
          </button>
          <button id="upload-1688-search" class="feature-btn">
            <span class="icon">🔍</span>
            上传1688搜索数据
          </button>
        </div>
      </div>
      
      <div class="info-section" id="info-section" style="display: none;">
        <h3>分析结果</h3>
        <div id="analysis-result" class="analysis-content">
          <!-- 动态内容将在这里显示 -->
        </div>
      </div>
    </main>
    
    <footer class="popup-footer">
      <div class="settings">
        <button id="settings-btn" class="settings-btn">⚙️ 设置</button>
        <button id="refresh-btn" class="settings-btn">🔄 刷新</button>
      </div>
    </footer>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
